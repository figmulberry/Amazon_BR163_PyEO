name: Project Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Confirm that the core project structure required for the
      # BR-163 Sentinel-2 processing workflow is still present.
      # This check does not run processing or modify GIS outputs.
      - name: Validate project structure
        shell: bash
        run: |
          test -f README.md
          test -f 00_admin/amazon_br163_working.ini
          test -f scripts/verify_configuration.py
          test -d 03_notebooks
          test -d 04_training
          test -d 05_model
          echo "Project structure validation passed."
