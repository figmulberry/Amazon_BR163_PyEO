# ============================================================================
# AMAZON BR-163 PYEO CONFIGURATION TEMPLATE — DO NOT RUN UNTIL EVERY PLACEHOLDER
# HAS BEEN REPLACED AND THE WORKFLOW'S GATES A–D HAVE PASSED.
# This preserves the section/key structure of the repository's pyeo_windows.ini
# while disabling all processing by default.
# ============================================================================

[run_mode]
do_parallel = False
qsub_processor_options = nodes=1:ppn=16,vmem=64Gb
wall_time_hours = 3
watch_time_hours = 3
watch_period_seconds = 60

[forest_sentinel]
# Acquisition dates, yyyymmdd. Use comparable Amazon dry-season windows.
start_date=<MONITORING_START_YYYYMMDD>
end_date=<MONITORING_END_YYYYMMDD>
composite_start=<BASELINE_START_YYYYMMDD>
composite_end=<BASELINE_END_YYYYMMDD>
# Replace after confirming the pilot Sentinel-2 tile CRS in QGIS.
epsg=<PILOT_TILE_EPSG>
cloud_cover=25
cloud_certainty_threshold=0
model=C:\GIS\projects\Amazon_BR163_PyEO\05_model\<AMAZON_MODEL_FILENAME>.pkl

[environment]
pyeo_dir=C:\GIS\src\pyeo
tile_dir=C:\GIS\data\Amazon_BR163_PyEO\tile_data
integrated_dir=C:\GIS\projects\Amazon_BR163_PyEO\08_change\integrated
roi_dir=C:\GIS\projects\Amazon_BR163_PyEO\01_roi\pilot
roi_filename=amazon_br163_pilot.gpkg
geometry_dir=C:\GIS\projects\Amazon_BR163_PyEO\02_reference
s2_tiles_filename=sentinel2_tiles_br163.gpkg
log_dir=C:\GIS\logs
log_filename=amazon_br163_pyeo.log
credentials_path=C:\GIS\secrets\pyeo_cdse.ini
environment_manager=conda
conda_directory=C:\Users\<WINDOWS_USER>\miniconda3
conda_env_name=pyeo_env
# Not used for the initial L2A workflow. Leave as a clear non-working placeholder.
sen2cor_path=<NOT_USED_FOR_L2A>

[raster_processing_parameters]
# SAFETY: keep all switches False until the matching workflow gate passes.
do_tile_intersection=False
do_raster=False
chunks=10
do_skip_existing=True
do_quicklooks=False
do_delete=False
do_zip=False
do_all=False
do_update=False
do_dev=False

download_source=dataspace
faulty_granule_threshold=350
band_names=["B02", "B03", "B04", "B08"]
resolution_string="10m"
output_resolution=10

do_build_composite=False
buffer_size_cloud_masking_composite=10
download_limit=10

do_download=False
buffer_size_cloud_masking=20

do_build_prob_image=False
do_classify=False
# Replace only after the Amazon model and its exact class order are finalized.
class_labels=["closed forest", "secondary woody vegetation", "pasture or agriculture", "fresh clearing or exposed soil", "burn scar", "water", "built surface or road"]
sieve=0

do_change=False
# Initial pilot: closed forest (1) to fresh clearing/exposed soil (4).
change_from_classes=[1]
change_to_classes=[4]

[vector_processing_parameters]
# Replace with suitable Brazilian administrative boundaries before vectorization.
level_1_filename=<BRAZIL_LEVEL_1_FILENAME>
level_2_filename=<BRAZIL_LEVEL_2_FILENAME>
level_3_filename=<BRAZIL_LEVEL_3_FILENAME>
do_delete_existing_vector=False
do_vectorise=False
do_integrate=False
do_filter=False
counties_of_interest=[]
minimum_area_to_report_m2=120
do_distribution=False
