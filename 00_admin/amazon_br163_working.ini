# Edit the variables below and save before running the pipeline
# SAFE VALIDATION BASELINE FOR AMAZON BR163
# All processing-stage flags are disabled to prevent downloads, raster rebuilds,
# vector rewrites, compression, or deletion during Restart Kernel and Run All.
# Enable only one intended phase at a time, then restore it to False after completion.
# Replace every remaining TO_BE_CONFIRMED value before enabling its related phase.

[run_mode]
# flag for linear or parallel processing of the raster and vector processing pipeline
do_parallel = False
# wall_time_hours and qsub_processor_options are currently hardcoded to 24 hours, at line 495 of acd_national.py
qsub_processor_options = nodes=1:ppn=16,vmem=64Gb
wall_time_hours = 3
watch_time_hours = 3
watch_period_seconds = 60
# needs to be in the format "nodes=1:ppn=16,vmem=64Gb"

[forest_sentinel]
# aoi_name: The name of this area of interest. No spaces.
# Amazon BR163 pilot identifier. No spaces.
aoi_name=Amazon_BR163_Pilot

# Acquisition dates in the form yyyymmdd
start_date=20250701
end_date=20250930

# Dates to download and preprocess for the initial cloud-free composite
composite_start=20240701
composite_end=20240930

# Selected tiles 21MXM and 21MYM use WGS 84 / UTM zone 21S.
# Do not use EPSG:4326 for 10-metre raster processing or area calculations.
epsg=32721

# Cloud cover threshold for imagery to download
cloud_cover=25

# Certainty value above which a pixel is considered a cloud from sen2cor
cloud_certainty_threshold=0

# path to the new Amazon BR163 model; never use the Kenya model
model = C:\GIS\projects\Amazon_BR163_PyEO\05_model\amazon_forest_clearing_extratrees.pkl

[environment]
# pyeo_dir needs to be an absolute path
pyeo_dir = C:\GIS\src\pyeo

# tile_dir needs to be an absolute path
tile_dir = C:\GIS\data\Amazon_BR163_PyEO\tile_data

# Relative paths are relative to pyeo_dir\
integrated_dir = C:\GIS\projects\Amazon_BR163_PyEO\08_change\integrated
roi_dir = C:\GIS\projects\Amazon_BR163_PyEO\01_roi\pilot
roi_filename = amazon_br163_pilot.gpkg
geometry_dir = C:\GIS\projects\Amazon_BR163_PyEO\02_reference
s2_tiles_filename = sentinel2_tiles\sentinel2_tiles_br163.gpkg
log_dir = C:\GIS\logs
log_filename = amazon_br163_pyeo.log
credentials_path = C:\GIS\secrets\pyeo_cdse.ini

environment_manager = conda
# conda_environment
conda_directory = C:\Users\moses\miniconda3
conda_env_name = pyeo_env

# Path to the sen2cor preprocessor script, L2A_Process. Usually in the bin\ folder of your sen2cor installation.
sen2cor_path = TO_BE_CONFIRMED_IF_L1C_PROCESSING_IS_ENABLED
# sen2cor_path remains unresolved because Path A uses downloaded L2A data.


[raster_processing_parameters]

do_tile_intersection = False

# **************************************************************************************************************************

do_raster = False
chunks = 10
do_skip_existing = False
do_quicklooks = False
do_delete = False
do_zip = False
# do_zip, consider removing
do_all = False
# do_dev, consider removing
do_update = False
# do_update, consider removing
do_dev = False

# **************************************************************************************************************************
# ***** STEP 4 SETUP GENERAL RASTER PROCESSING PARAMETERS ***** 
# download_source = scihub
download_source = dataspace
# granules below this size in MB will not be downloaded
faulty_granule_threshold = 350
# list of strings with the band name elements of the image file names in "" string notation
# MODEL/BAND ORDER CONTROL: training and every later classification must use B02, B03, B04, B08 in exactly this order
band_names = ["B02", "B03", "B04", "B08"]
# file name pattern to search for when identifying band file locations in "" string notation
resolution_string = "10m"
# spatial resolution of the output raster files in metres. Can be any resolution, not just 10, 20 or 60 as in the default band resolutions of Sentinel-2
output_resolution = 10
# **************************************************************************************************************************


# ***** STEP 4a DOWNLOAD REFERENCE IMAGES AND BUILD A MEDIAN COMPOSITE ***** 
do_build_composite = False
# set buffer in number of pixels for dilating the SCL cloud mask (recommend 10 pixels of 10 m) for the composite building
buffer_size_cloud_masking_composite = 10
# maximum number of images to be downloaded for compositing, in order of least cloud cover
download_limit = 10
# **************************************************************************************************************************


# ***** STEP 4b: DOWNLOAD CHANGE DETECTION IMAGES FOR THE REQUIRED DATE RANGE ***** 
do_download = False
# set buffer in number of pixels for dilating the SCL cloud mask (recommend 30 pixels of 10 m) for the change detection
buffer_size_cloud_masking = 20
# **************************************************************************************************************************


# ***** STEP 4c: CLASSIFIY THE COMPOSITE AND CHANGE DETECTION IMAGES ***** 
do_build_prob_image = False
do_classify = False
# Class labels must match the validated binary Amazon model.
class_labels = ["Forest", "Clearing"]

# If sieve is 0, no sieve is applied.
sieve = 0
# **************************************************************************************************************************


# ***** STEP 4d: DETECT CHANGES AND BUILD RASTER REPORTS ***** 
do_change = False
# Detect transitions from Forest.
change_from_classes = [1]
# Detect transitions to Clearing.
change_to_classes = [2]
# **************************************************************************************************************************


# ***** STEP 5: VECTOR ANALYSIS OF TILE RASTER REPORTS ***** 
[vector_processing_parameters]
level_1_filename = administrative\geoBoundaries-BRA-ADM1.shp
# vectorisation currently hardcoded to use level_1_filename
level_2_filename = administrative\geoBoundaries-BRA-ADM2.shp
level_3_filename = TO_BE_CONFIRMED_BRAZIL_LEVEL_3_REFERENCE.json

do_delete_existing_vector = False
do_vectorise = False
# ***** STEP 6: INTEGRATE VECTOR ANALYSES TO NATIONAL SCOPE ***** 
do_integrate = False
# **************************************************************************************************************************


# ***** STEP 7: FILTER NATIONAL SCOPE VECTORISED FOREST ALERTS ***** 
do_filter = False
# Optional administrative-area filtering remains disabled until Brazil reference layers are confirmed.
admin_areas_of_interest = []
# Keep this list empty until verified Brazil administrative areas are deliberately configured.
minimum_area_to_report_m2 = 120
# **************************************************************************************************************************


# ***** STEP 8: FILTER NATIONAL SCOPE VECTORISED FOREST ALERTS ***** 
# MANUAL ASSESSMENT OF ALERTS BY AUTHORIZED AMAZON BR163 REVIEW STAFF
# **************************************************************************************************************************


# ***** STEP 9: AUTOMATED DISTRIBUTION OF FILTERED ALERTS BY MESSAGING (E.G. WHATSAPP) ***** 
[alerts_sending_options]

do_distribution = False
email_alerts = False
email_list_file = ""
whatsapp_alerts = False
whatsapp_list_file = ""
# **************************************************************************************************************************
